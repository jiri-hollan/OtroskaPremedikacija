<style>
  :root {
    --bg: #f3f5f8;
    --card: #ffffff;
    --text: #1b2430;
    --muted: #5d6b7c;
    --line: #dde3ea;
    --accent: #1f6feb;
    --accent-soft: #e7f0ff;
    --warn: #b45309;
    --warn-soft: #fff4e0;
    --err: #b00020;
    --err-soft: #fde8ec;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11161d; --card: #1a212b; --text: #e6ebf1; --muted: #9aa7b6;
      --line: #2c3643; --accent: #5b9bff; --accent-soft: #1d2b42;
      --warn: #f0a94a; --warn-soft: #3a2c14; --err: #ff7088; --err-soft: #3d1a22;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 40px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .container { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px;
  }
  .naslov { font-size: 13px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px; }

  /* izbira učinkovine – velike tipke */
  .ucinkovine { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ucinkovine input { position: absolute; opacity: 0; pointer-events: none; }
  .ucinkovine label {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 64px; padding: 8px 4px; border: 2px solid var(--line); border-radius: 12px;
    cursor: pointer; font-size: 16px; font-weight: 600; text-align: center;
    transition: border-color .15s, background .15s;
  }
  .ucinkovine label small { font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .ucinkovine input:checked + label { border-color: var(--accent); background: var(--accent-soft); }
  @media (max-width: 380px) { .ucinkovine label { font-size: 14px; } }
  .ucinkovine input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* teža */
  .teza { display: flex; align-items: center; gap: 8px; }
  .teza button {
    width: 52px; height: 52px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--card); color: var(--text); font-size: 26px; cursor: pointer;
  }
  .teza button:active { background: var(--accent-soft); }
  .teza .polje { position: relative; flex: 1; }
  #tezaPremedikacijaId {
    width: 100%; height: 52px; font-size: 26px; font-weight: 600; text-align: center;
    padding: 0 40px 0 10px; border: 2px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--text); outline: none;
  }
  #tezaPremedikacijaId:focus { border-color: var(--accent); }
  .teza .enota { position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 16px; pointer-events: none; }

  /* faktor */
  .faktor-glava { display: flex; justify-content: space-between; align-items: baseline; }
  #faktorId { font-size: 22px; font-weight: 700; }
  #faktorId.spremenjeno { color: var(--warn); }
  #sprememba { width: 100%; margin: 10px 0 2px; accent-color: var(--accent); height: 28px; }
  .lestvica { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  #ponastavi { border: none; background: none; color: var(--accent); font-size: 14px;
    cursor: pointer; padding: 0; visibility: hidden; }

  /* rezultat */
  .rezultat { border-width: 2px; }
  .rezultat.aktiven { border-color: var(--accent); }
  .prazno { color: var(--muted); text-align: center; padding: 18px 0; }
  .volumen { font-size: 46px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
  .volumen span { font-size: 22px; font-weight: 600; color: var(--muted); }
  .doza { font-size: 18px; margin-top: 6px; }
  .pot { display: inline-block; margin-top: 10px; padding: 4px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px; }
  .opomba { margin-top: 10px; padding: 8px 10px; border-radius: 10px;
    background: var(--warn-soft); color: var(--warn); font-weight: 600; }
  .navodila { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 15px; line-height: 1.4; }
  .navodila b { color: var(--text); }
  .izracun { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .napaka { padding: 12px; border-radius: 10px; background: var(--err-soft);
    color: var(--err); font-weight: 600; text-align: center; }

  footer { font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; }
</style>
</head>
<body>

<script>
/* ==================================================================
   PODATKI – kopija tabele premedikacija1Tbl
   ------------------------------------------------------------------
   Pravilo izbire (enako kot v kardiosi): za izbrano učinkovino se
   vzame vrstica z NAJVEČJO "teza", ki je <= vnesena teža × faktor.
   doza = na kg, koncentracija = v enoti doze na ml
   (midazolam, ketamin: mg/kg in mg/ml; dexmedetomidin: mcg/kg in mcg/ml).
   Podatke spremeniš tukaj (shrani datoteko in osveži stran).
   ================================================================== */
const PREMEDIKACIJA = [
  { id: 1, ucinkovina: "midazolam",      teza: 1,  doza: 0.5, koncentracija: 1.5,  navodila: "Midazolam sirup 1,5 mg/ml" },
  { id: 2, ucinkovina: "dexmedetomidin", teza: 1,  doza: 3.0, koncentracija: 10.0, navodila: "10 mcg/ml (1 ml originalnega zdravila dexmedetomidin 100 mcg/ml razredčimo z 9 ml 0,9% NaCl)" },
  { id: 3, ucinkovina: "dexmedetomidin", teza: 5,  doza: 3.0, koncentracija: 50.0, navodila: "50 mcg/ml (1 ml originalnega zdravila dexmedetomidin 100 mcg/ml razredčimo z 1 ml 0,9% NaCl)" },
  { id: 4, ucinkovina: "dexmedetomidin", teza: 20, doza: 3.0, koncentracija: 100.0, navodila: "100 mcg/ml (originalnega zdravila dexmedetomidin 100 mcg/ml ni potrebno redčiti)" },
  { id: 5, ucinkovina: "ketamin",        teza: 1,  doza: 5.0, koncentracija: 25.0, navodila: "raztopina za injekcije 25mg/ml" }
];
</script>

<div class="container">
  <h1>Otroška premedikacija</h1>

  <section class="card">
    <p class="naslov">Učinkovina</p>
    <div class="ucinkovine">
      <input type="radio" id="midazolamId" name="ucinkovina" value="midazolam">
      <label for="midazolamId">midazolam<small>oralno</small></label>
      <input type="radio" id="dexmedetomidinId" name="ucinkovina" value="dexmedetomidin">
      <label for="dexmedetomidinId">dexmedetomidin<small>nasalno</small></label>
      <input type="radio" id="ketaminId" name="ucinkovina" value="ketamin">
      <label for="ketaminId">ketamin<small>oralno</small></label>
    </div>
  </section>

  <section class="card">
    <p class="naslov"><label for="tezaPremedikacijaId">Teža</label></p>
    <div class="teza">
      <button type="button" id="manj" aria-label="Zmanjšaj težo za 1 kg">−</button>
      <div class="polje">
        <input id="tezaPremedikacijaId" type="text" inputmode="decimal" value="2" maxlength="5" autocomplete="off">
        <span class="enota">kg</span>
      </div>
      <button type="button" id="vec" aria-label="Povečaj težo za 1 kg">+</button>
    </div>
  </section>

  <section class="card">
    <div class="faktor-glava">
      <p class="naslov" style="margin:0"><label for="sprememba">Sprememba doze</label></p>
      <span><span id="faktorId">1</span> ×</span>
    </div>
    <input type="range" id="sprememba" min="0.5" max="2" step="0.1" value="1" list="tickmarks">
    <datalist id="tickmarks">
      <option value="0.5"></option><option value="1"></option>
      <option value="1.5"></option><option value="2"></option>
    </datalist>
    <div class="lestvica"><span>0,5×</span><button type="button" id="ponastavi">ponastavi na 1×</button><span>2×</span></div>
  </section>

  <section id="rezultat" class="card rezultat" aria-live="polite">
    <div class="prazno">Izberi učinkovino.</div>
  </section>

  <footer>Samostojna različica kalkulatorja iz kardiosi – deluje brez strežnika in brez interneta.</footer>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const slider = $("sprememba");
  const tezaPolje = $("tezaPremedikacijaId");
  const out = $("rezultat");

  // izpis števila podobno kot PHP (brez napak plavajoče vejice, npr. 7.5 namesto 7.500000001)
  const st = x => String(parseFloat(x.toPrecision(12)));
  const round1 = x => Math.round((x + Number.EPSILON) * 10) / 10;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function izberi(ucinkovina, teza) {
    // ekvivalent: WHERE teza <= ? AND ucinkovina = ? ORDER BY teza DESC LIMIT 1
    const kandidati = PREMEDIKACIJA
      .filter(r => r.ucinkovina === ucinkovina && r.teza <= teza)
      .sort((a, b) => b.teza - a.teza);
    return kandidati[0] || null;
  }

  function prikazi(html, aktiven) {
    out.innerHTML = html;
    out.classList.toggle("aktiven", !!aktiven);
  }

  function izracun() {
    const faktor = parseFloat(slider.value);
    $("faktorId").textContent = slider.value;
    $("faktorId").classList.toggle("spremenjeno", faktor !== 1);
    $("ponastavi").style.visibility = faktor !== 1 ? "visible" : "hidden";

    const izbrana = document.querySelector("input[name=ucinkovina]:checked");
    if (!izbrana) { prikazi('<div class="prazno">Izberi učinkovino.</div>'); return; }
    const ucinkovina = izbrana.value;
    const tezaVnos = parseFloat(String(tezaPolje.value).replace(",", "."));

    if (!isFinite(tezaVnos) || tezaVnos <= 0) {
      prikazi('<div class="napaka">Vnesi veljavno težo.</div>'); return;
    }
    const teza = tezaVnos * faktor;
    const v = izberi(ucinkovina, teza);
    if (!v || (ucinkovina === "ketamin" && !(v.koncentracija > 0))) {
      prikazi('<div class="napaka">za to težo ni navodil</div>'); return;
    }

    const dozaMg = v.doza * teza;
    const dozaMl = round1(dozaMg / v.koncentracija);
    let ime, enota, pot, opomba = "";

    if (ucinkovina === "midazolam") {
      ime = "Midazolam"; enota = "mg"; pot = "oralno";
    } else if (ucinkovina === "dexmedetomidin") {
      ime = "Dexmedetomidin"; enota = "mcg"; pot = "nasalno";
      if (dozaMl >= 0.6) opomba = "Razpodelimo v obe nosnici.";
    } else if (ucinkovina === "ketamin") {
      ime = "Ketamin"; enota = "mg"; pot = "oralno";
    }

    prikazi(
      `<div class="volumen">${st(dozaMl)} <span>ml</span></div>
       <div class="doza"><b>${ime}</b> ${st(dozaMg)} ${enota}</div>
       <span class="pot">${pot}</span>
       ${opomba ? `<div class="opomba">${opomba}</div>` : ""}
       <div class="navodila"><b>Uporabljeno zdravilo:</b> ${esc(v.navodila)}</div>
       <div class="izracun">${st(v.doza)} ${enota}/kg × ${st(teza)} kg` +
         (faktor !== 1 ? ` (${st(tezaVnos)} kg × ${slider.value})` : "") + `</div>`,
      true
    );
  }

  function korak(d) {
    const t = parseFloat(String(tezaPolje.value).replace(",", "."));
    const nova = Math.max(1, Math.round((isFinite(t) ? t : 0) + d));
    tezaPolje.value = nova;
    izracun();
  }

  document.querySelectorAll("input[name=ucinkovina]").forEach(r => r.addEventListener("change", izracun));
  tezaPolje.addEventListener("input", izracun);
  tezaPolje.addEventListener("focus", () => tezaPolje.select());
  slider.addEventListener("input", izracun);
  $("manj").addEventListener("click", () => korak(-1));
  $("vec").addEventListener("click", () => korak(1));
  $("ponastavi").addEventListener("click", () => { slider.value = 1; izracun(); });
  izracun();
})();
</script>
</body>
</html>
